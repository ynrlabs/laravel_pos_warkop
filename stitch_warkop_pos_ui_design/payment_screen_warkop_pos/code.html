<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = '';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = '';
            });
        });

        // Simple Payment Method Selector Mock Logic
        const pButtons = document.querySelectorAll('.w-1\\/3 button');
        pButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                pButtons.forEach(b => {
                    b.classList.remove('active-payment');
                    const icon = b.querySelector('.material-symbols-outlined');
                    const text = b.querySelector('span:not(.material-symbols-outlined)');
                    if (icon) icon.classList.remove('text-primary');
                    if (icon) icon.classList.add('text-on-surface-variant');
                    if (text) text.classList.remove('font-bold', 'text-on-surface');
                    if (text) text.classList.add('text-on-surface-variant');
                });
                btn.classList.add('active-payment');
                const activeIcon = btn.querySelector('.material-symbols-outlined');
                const activeText = btn.querySelector('span:not(.material-symbols-outlined)');
                if (activeIcon) activeIcon.classList.remove('text-on-surface-variant');
                if (activeIcon) activeIcon.classList.add('text-primary');
                if (activeText) activeText.classList.remove('text-on-surface-variant');
                if (activeText) activeText.classList.add('font-bold', 'text-on-surface');
            });
        });
    </script>
