<script>
        let currentPin = "";
        const maxPinLength = 6;
        let selectedStaffName = "";

        function selectStaff(name, role) {
            // Remove active classes from all cards
            document.querySelectorAll('.staff-card').forEach(card => {
                card.classList.remove('staff-card-active', 'border-primary', 'bg-primary-container/10');
            });
            
            // Add to event source
            const card = event.currentTarget;
            card.classList.add('staff-card-active', 'border-primary');
            
            selectedStaffName = name;
            const staffDisplay = document.getElementById('staff-display');
            const nameEl = document.getElementById('active-staff-name');
            
            nameEl.innerText = name;
            staffDisplay.classList.remove('opacity-0');
            staffDisplay.classList.add('opacity-100');
            
            clearPin();
        }

        function pressKey(num) {
            if (currentPin.length < maxPinLength) {
                currentPin += num;
                updateDots();
            }
        }

        function deleteLast() {
            currentPin = currentPin.slice(0, -1);
            updateDots();
        }

        function clearPin() {
            currentPin = "";
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('pin-dot-active');
                    dot.classList.remove('border-outline-variant');
                } else {
                    dot.classList.remove('pin-dot-active');
                    dot.classList.add('border-outline-variant');
                }
            });

            const loginBtn = document.getElementById('login-btn');
            if (currentPin.length >= 4 && selectedStaffName !== "") {
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.add('hover:bg-primary-container', 'active:scale-95');
            } else {
                loginBtn.disabled = true;
                loginBtn.classList.add('opacity-50', 'cursor-not-allowed');
                loginBtn.classList.remove('hover:bg-primary-container', 'active:scale-95');
            }
        }

        function setMode(btn) {
            document.querySelectorAll('.mode-toggle').forEach(b => {
                b.classList.remove('bg-primary', 'text-on-primary', 'font-bold');
                b.classList.add('text-on-surface-variant', 'font-medium');
            });
            btn.classList.remove('text-on-surface-variant', 'font-medium');
            btn.classList.add('bg-primary', 'text-on-primary', 'font-bold');
        }

        // Handle success simulation
        document.getElementById('login-btn').addEventListener('click', function() {
            if (!this.disabled) {
                this.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Memproses...</span>
                `;
                setTimeout(() => {
                    alert('Selamat datang, ' + selectedStaffName + '! Shift Anda telah dimulai.');
                    window.location.reload();
                }, 1500);
            }
        });
    </script>
